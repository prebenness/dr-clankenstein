name: Build agent image

on:
  workflow_dispatch:
  push:
    paths:
      - container/**
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

env:
  OPENCLAW_COMMIT: 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c
  OPENCLAW_VERSION: 2026.7.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out agent repository
        uses: actions/checkout@v7

      - name: Check out pinned OpenClaw source
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ env.OPENCLAW_COMMIT }}
          path: openclaw-source

      - name: Verify OpenClaw version
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(jq -r .version openclaw-source/package.json)"
          test "$actual" = "$OPENCLAW_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned OpenClaw base
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg OPENCLAW_EXTENSIONS=codex,openai,memory-core \
            --tag openclaw-base:local \
            openclaw-source

      - name: Build and push runtime image
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${REPOSITORY,,}-box"
          tag="sha-${REVISION}"
          ref="$image:$tag"

          docker build \
            --build-arg OPENCLAW_BASE_IMAGE=openclaw-base:local \
            --build-arg OPENCLAW_VERSION="$OPENCLAW_VERSION" \
            --build-arg IMAGE_REVISION="$REVISION" \
            --file container/Dockerfile \
            --tag "$ref" \
            .

          docker push "$ref" 2>&1 | tee /tmp/image-push.log
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/image-push.log | tail -n 1)"
          test -n "$digest"

          token_status="$(curl --silent --show-error \
            --output /tmp/anonymous-token.json \
            --write-out '%{http_code}' \
            "https://ghcr.io/token?scope=repository:${image#ghcr.io/}:pull&service=ghcr.io")"
          if test "$token_status" = 200; then
            anonymous_token="$(jq -er .token /tmp/anonymous-token.json)"
            manifest_status="$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $anonymous_token" \
              --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${image#ghcr.io/}/manifests/$digest")"
            if test "$manifest_status" = 200; then
              echo 'The runtime image is anonymously accessible.' >&2
              exit 1
            fi
          fi

          printf 'ref=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable image reference
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          {
            printf '## Runtime image\n\n'
            printf '```text\nIMAGE_REF=docker://%s\n```\n' "$IMAGE_REF"
            printf '\nOpenClaw `%s` at commit `%s`.\n' "$OPENCLAW_VERSION" "$OPENCLAW_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
